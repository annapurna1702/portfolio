<style>
/* Layout: a full-bleed 3D archipelago. The camera flies between islands; a floating
   card on the right (bottom on phones) carries the words for whatever is in view. */
:root{
  --ink:#1c2133; --paper:#fbfaf7; --muted:#5a6177; --line:rgba(28,33,51,.14);
  --accent:#3b3fb6; --accent2:#e48a26; --night:0;
  --f-display:'Gloock',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8ecf8; --paper:#131a32; --muted:#9ba4bf; --line:rgba(232,236,248,.14);
  --accent:#a4abff; --accent2:#f2a654; --night:1; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8ecf8; --paper:#131a32; --muted:#9ba4bf; --line:rgba(232,236,248,.14);
  --accent:#a4abff; --accent2:#f2a654; --night:1; color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.logo span{color:var(--accent)}
.chips{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink)}
html.theming body,html.theming header,html.theming .card,html.theming .card *,html.theming .tip,html.theming .rb,html.theming .hint,html.theming .tbtn,html.theming .chip,html.theming .stage{transition:background-color 1.8s,color 1.8s,border-color 1.8s!important}
.chip.on{color:var(--accent);border-color:var(--accent)}
.chip:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn{font-family:var(--f-mono);font-size:11px;background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .8s}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:none;background:var(--paper)}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#world.pick{cursor:pointer}
canvas#world.paint{cursor:crosshair}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.card{position:absolute;top:18px;right:max(18px,env(safe-area-inset-right,0px));width:min(380px,38vw);max-height:calc(100% - 36px);overflow-y:auto;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;box-shadow:0 18px 40px -24px rgba(0,0,0,.45);transition:opacity .35s,transform .35s}

.plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}

.item b{display:block;font-weight:600;margin-bottom:2px}

.lk:hover{border-color:var(--accent)}
.lk small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}

.tip{position:absolute;left:0;top:0;pointer-events:none;max-width:260px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px -16px rgba(0,0,0,.5);transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .18s}

.stage.intro .card,.stage.intro .ctrl{opacity:0;pointer-events:none}
.intro-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;opacity:0;transition:opacity 1s;z-index:3}

.intro-ui p{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin:0;text-shadow:0 0 18px var(--paper)}
.intro-ui h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5.4vw,58px);line-height:1.05;color:var(--ink);margin:0;text-align:center;text-wrap:balance;text-shadow:0 0 28px var(--paper),0 0 8px var(--paper)}
.skip{pointer-events:auto;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink);background:color-mix(in srgb,var(--paper) 55%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--ink);background:var(--paper);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
@media (max-width:720px){
  .logo{font-size:17px}
  .card{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:42%;padding:16px 16px 14px}
  .card h2{font-size:24px}
  .ctrl{top:12px;bottom:auto}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.card,.tip,.prog{transition:none}}
</style>

<div class="app">

let drag=null,moved=0,painting=false;

const clock=new THREE.Clock();let last=0;const sph=new THREE.Spherical(),tmp=V(),tmp2=V(),tmp3=V(),prevPos=V(),UP=V(0,1,0);let bank=0,frameN=0;

  if(nightP!==nightT){nightP=nightT>nightP?Math.min(nightT,nightP+dt/blendDur):Math.max(nightT,nightP-dt/blendDur);nightK=sstep(nightP);applyBlend(false)}
  WU.t.value=at;WU.fogNear.value=scene.fog.near;WU.fogFar.value=scene.fog.far;updateLotus(dt,at);updateLife(at);updateExtras(at);updateIntro(dt);
  const ok=intro.on?0:1;if(Math.abs(ok-offK)>.001){offK+=(ok-offK)*.04;applyOffset()}

  clouds.forEach((c,k)=>{if(!reduce)c.position.x+=dt*(.6+k%3*.3);if(c.position.x>WORLD_C.x+220)c.position.x=WORLD_C.x-220});
  skillNodes.forEach(n=>{const u=n.userData,s=n===hovered?1.7:1;n.position.y=u.base+Math.sin(at*1.2+u.ph)*.12;n.scale.lerp(tmp.set(s,s,s),.2);n.rotation.y=at*.5});
  pulses.forEach(p=>{p.t+=dt*.7;if(p.t>1){p.t=0;p.e=skillEdges[(Math.random()*skillEdges.length)|0]}p.m.position.copy(p.e[0].position).lerp(p.e[1].position,p.t)});
  skillGroup.rotation.y=Z[1].a+Math.sin(at*.15)*.12;
  const act=STOPS[cur].pi;
  exhibits.forEach((e,i)=>{const h=!!hovered&&hovered.userData.kind==='proj'&&hovered.userData.i===i,a=i===act&&zone===2;
    e.hov+=((h?1:0)-e.hov)*.15;e.act+=((a?1:0)-e.act)*.08;
    e.ex.g.position.y=.4+e.hov*.5+e.act*.35+Math.sin(at*1.3+i)*.06;e.ring.material.opacity=Math.max(e.hov,e.act)*.9;
    e.ex.up(at+i*1.7,h||a)});
  if(projName&&act>=0)projName.position.y=exhibits[act].pos.y+5.6+Math.sin(at*1.5)*.1;
  if(bloomT>=0){bloomT+=dt;flowers.forEach(f=>{const u=reduce?1:Math.max(0,Math.min(1,(bloomT-f.delay)/1.2)),e=1+2.2*Math.pow(u-1,3)+1.2*Math.pow(u-1,2);
    f.st.scale.y=.2+.8*Math.min(1,u*1.5);f.head.position.y=f.h*f.st.scale.y;f.st.position.y=f.h*f.st.scale.y/2;f.head.scale.setScalar(Math.max(.01,u>0?e:.01))})}
  flowers.forEach((f,k)=>f.head.rotation.y=at*.3+k);
  pillars.forEach(p=>{const u=p.userData;u.hit=Math.max(0,u.hit-dt*1.8);p.position.y=u.base+Math.sin(u.hit*Math.PI)*.4+(p===hovered?.12:0);p.material.emissiveIntensity=(.05+.3*nightK)+u.hit*1.2});
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;r.m.scale.setScalar(1+r.t*5);r.m.material.opacity=Math.max(0,1-r.t/1.2);if(r.t>1.2){scene.remove(r.m);r.m.geometry.dispose();ripples.splice(i,1)}}
  for(let i=floatNotes.length-1;i>=0;i--){const n=floatNotes[i];n.t+=dt;n.s.position.y+=dt*1.6;n.s.position.x+=Math.sin(n.t*4)*.01+n.dx*dt;n.s.material.opacity=Math.max(0,1-n.t/2);if(n.t>2){scene.remove(n.s);floatNotes.splice(i,1)}}
  flags.forEach(f=>{const p=f.geometry.attributes.position;if(!f.userData.b)f.userData.b=Float32Array.from(p.array);const b=f.userData.b;for(let i=0;i<p.count;i++){const x=b[i*3];p.array[i*3+2]=Math.sin(x*5-at*5)*.12*x}p.needsUpdate=true;f.geometry.computeVertexNormals()});
  trophies.forEach((o,k)=>{o.rotation.y=at*.6+k;o.position.y=o.userData.by+Math.sin(at*1.5+k)*.15});
  helloTitle.material.opacity+=((zone===0?1:0)-helloTitle.material.opacity)*.05;helloTitle.visible=helloTitle.material.opacity>.02;
  zLabels.forEach((l,i)=>l.visible=camera.position.y>22&&(i!==zone||i===2&&STOPS[cur].pi<0));
  beam.rotation.y=reduce?.6:t*.6;
  boat.position.y=waveH(boat.position.x,boat.position.z,at)+.1;boat.rotation.z=Math.sin(at*.9)*.06;boat.rotation.x=Math.cos(at*.7)*.04;
  if(fly.on){fly.s=Math.min(1,fly.s+dt/fly.dur);const e=ease(fly.s),a=1-e,et=ease(Math.min(1,fly.s*1.5));
    if(fly.orbit){const C=ctr(2),pol=v=>[Math.atan2(v.z-C.z,v.x-C.x),Math.hypot(v.x-C.x,v.z-C.z)],orb=(f,t2,u,out)=>{const[a0,r0]=pol(f),[a1,r1]=pol(t2);let da=a1-a0;da=Math.atan2(Math.sin(da),Math.cos(da));const an=a0+da*u,rr=r0+(r1-r0)*u;return out.set(C.x+Math.cos(an)*rr,f.y+(t2.y-f.y)*u,C.z+Math.sin(an)*rr)};
      orb(fly.fp,fly.tp,e,cam.p);cam.p.y+=Math.sin(Math.PI*e)*1.2;orb(fly.ft,fly.tt,e,cam.t)}
    else{cam.p.set(0,0,0).addScaledVector(fly.fp,a*a).addScaledVector(fly.mid,2*a*e).addScaledVector(fly.tp,e*e);cam.t.lerpVectors(fly.ft,fly.tt,et)}

  renderer.render(scene,camera);requestAnimationFrame(frame)}

document.documentElement.setAttribute('data-theme',intro.on?'dark':'light');
